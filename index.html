:root{
  --navy:#272B58; --navy2:#343A6E; --blue:#5576FF; --blue-d:#3F5EE0;
  --teal:#2FBFA8; --mint:#A8E6D5; --mint-l:#E3F5EF;
  --page:#F4F5F9; --card:#FFFFFF; --line:#E4E6EF;
  --ink:#272B58; --body:#5C5F79; --mute:#8A8DA6;
  --pale:#BCC1DE;
  --safe-t:20px; --safe-b:50px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#15182F;font-family:Mont,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#screen{width:800px;height:1280px;flex:none;transform-origin:center;position:relative;overflow:hidden;background:var(--page)}

@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes feed{0%{transform:scale(1)}35%{transform:scale(.9)}100%{transform:scale(1)}}
@keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(286px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─────────── presentation ─────────── */
.slide{position:absolute;inset:0;background:var(--navy);display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;
  padding:calc(var(--safe-t) + 60px) 50px calc(var(--safe-b) + 40px);animation:fade .45s ease both}
.fig{font-weight:700;color:#fff;letter-spacing:-.045em;line-height:.92;text-align:center;white-space:nowrap}
.fig-lead{font-size:158px}
.fig-med{font-size:104px}
.fig-stack{font-size:152px;display:flex;flex-direction:column;align-items:center;line-height:.94}
.fig-stack .fig-2{font-size:82px;font-weight:600;letter-spacing:.005em;margin-top:10px}
.cap{margin-top:40px;font-size:25px;font-weight:500;color:#fff;letter-spacing:.1em;
  text-align:center;text-wrap:balance;max-width:620px;line-height:1.45}
.src{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 34px);text-align:center;
  font-size:16px;font-weight:400;color:#7C82AC;letter-spacing:.07em}

/* slide 4 */
.slide.s4{justify-content:flex-start;padding-top:300px}
.s4-title{font-size:62px;font-weight:700;color:#fff;letter-spacing:-.03em;text-align:center}
.s4-row{margin-top:118px;display:flex;flex-direction:column;align-items:center}
.s4-node{text-align:center;font-size:47px;font-weight:600;color:#fff;letter-spacing:-.01em;
  white-space:nowrap;line-height:1.1}
.s4-node.mid{color:var(--teal);font-size:53px;font-weight:700}
.s4-arrow{display:flex;align-items:center;justify-content:center;padding:14px 0}
.s4-foot{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 34px);text-align:center;
  font-size:19px;font-weight:500;color:#fff;letter-spacing:.09em;opacity:.82}

/* slide 5 */
.slide.s5{justify-content:flex-start;padding-top:300px}
.s5-list{margin-top:118px;display:flex;flex-direction:column;align-items:center;gap:42px}
.s5-item{font-size:47px;font-weight:600;color:#fff;letter-spacing:-.01em;white-space:nowrap;line-height:1.1}

/* ─────────── app shell ─────────── */
.app{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--page)}
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(var(--safe-t) + 22px) 30px 22px;background:#fff;border-bottom:1px solid var(--line)}
.hdr-l{display:flex;align-items:center;gap:16px;min-height:56px}
.icon-btn{display:flex;align-items:center;justify-content:center;width:56px;height:56px;
  border-radius:18px;background:var(--page);cursor:pointer;flex:none}
.icon-btn:active{background:var(--line)}
.lock{font-weight:700;font-size:23px;color:var(--navy);letter-spacing:-.01em;white-space:nowrap}
.lock i{font-style:normal;font-weight:600;color:var(--blue)}
.sep{width:1px;height:34px;background:var(--line);flex:none}
.hdr-t{font-size:21px;font-weight:600;color:var(--ink);line-height:1.15}
.hdr-s{font-size:12px;font-weight:400;color:var(--mute);letter-spacing:.16em;text-transform:uppercase}
.cancel{display:flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 22px;
  border-radius:16px;background:var(--page);color:var(--mute);font-size:19px;font-weight:500;cursor:pointer;flex:none}
.cancel:active{background:var(--line);color:var(--ink)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 0 var(--safe-b)}
.pane{flex:1;display:flex;flex-direction:column;padding:44px 44px 34px;animation:rise .3s ease both}

h1{font-size:46px;font-weight:700;color:var(--ink);letter-spacing:-.025em;line-height:1.1}
.sub{font-size:24px;font-weight:400;color:var(--body);margin-top:10px;text-wrap:pretty}
.step{display:flex;align-items:center;gap:12px;font-size:20px;font-weight:600;color:var(--teal);letter-spacing:.02em}
.step b{width:9px;height:9px;border-radius:50%;background:var(--teal)}
.grow{flex:1}

/* cards */
.card{display:flex;align-items:center;gap:20px;padding:22px 26px;border-radius:22px;background:#fff;
  border:2px solid var(--line);cursor:pointer}
.card:active{border-color:var(--blue);background:#F7F9FF}
.card.hero{background:var(--blue);border-color:var(--blue);box-shadow:0 14px 30px rgba(85,118,255,.28)}
.card.hero:active{background:var(--blue-d)}
.sq{display:flex;align-items:center;justify-content:center;width:66px;height:66px;border-radius:18px;
  background:var(--page);flex:none}
.card.hero .sq{background:rgba(255,255,255,.18)}
.ct{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.cs{font-size:18px;font-weight:400;color:var(--mute);margin-top:3px}
.card.hero .ct{color:#fff}
.card.hero .cs{color:rgba(255,255,255,.86)}
.stack{display:flex;flex-direction:column;gap:14px;margin-top:24px}
.divider{display:flex;align-items:center;gap:14px;margin:8px 2px 2px}
.divider span{font-size:14px;font-weight:600;color:var(--mute);letter-spacing:.16em}
.divider i{flex:1;height:1px;background:var(--line)}

/* primary button */
.btn{display:flex;align-items:center;justify-content:center;height:100px;border-radius:22px;
  font-size:30px;font-weight:600;cursor:pointer;background:var(--blue);color:#fff;
  box-shadow:0 14px 30px rgba(85,118,255,.26)}
.btn:active{background:var(--blue-d)}
.btn.off{background:#E2E4EE;color:#A6ABC4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--page);color:#4A4F70;box-shadow:none;height:82px;font-size:24px;font-weight:500}
.btn.ghost:active{background:var(--line)}
.btns{display:flex;flex-direction:column;gap:12px}

/* data rows */
.row{display:flex;align-items:center;justify-content:space-between;padding:24px 26px;border-radius:22px;
  background:#fff;box-shadow:0 6px 20px rgba(39,43,88,.05)}
.rk{font-size:22px;font-weight:400;color:var(--mute)}
.rv{font-size:24px;font-weight:600;color:var(--ink)}
.total{display:flex;flex-direction:column;align-items:center;gap:4px;padding:30px;border-radius:24px;background:var(--mint-l)}
.total-k{font-size:23px;font-weight:500;color:#1C7F6D}
.total-v{font-size:76px;font-weight:700;color:var(--teal);letter-spacing:-.03em;line-height:1.05}

/* keypad */
.field{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:22px;background:#fff;
  border:2px solid var(--line);box-shadow:0 6px 20px rgba(39,43,88,.05)}
.field.ok{border-color:var(--blue)}
.field-v{flex:1;font-size:36px;font-weight:600;color:var(--ink);letter-spacing:.08em}
.field-v.ph{color:#C4C8DC}
.keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.key{display:flex;align-items:center;justify-content:center;border-radius:20px;background:#fff;
  border:2px solid var(--line);font-size:36px;font-weight:500;color:var(--ink);cursor:pointer;min-height:72px}
.key:active{border-color:var(--blue);background:#F7F9FF}

/* scanner */
.scan{flex:1;display:flex;align-items:center;justify-content:center}
.scan-box{position:relative;width:400px;height:400px;border-radius:30px;background:#141834;overflow:hidden}
.corner{position:absolute;width:56px;height:56px;border:6px solid #fff}
.c1{top:26px;left:26px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.c2{top:26px;right:26px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.c3{bottom:26px;left:26px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.c4{bottom:26px;right:26px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.laser{position:absolute;top:60px;left:0;right:0;height:4px;
  background:linear-gradient(90deg,transparent,var(--mint),transparent);animation:scanline 1.7s ease-in-out infinite alternate}
.qr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:176px;height:176px;
  border-radius:12px;background:#fff;padding:10px;opacity:.95}
.scan-hint{text-align:center;font-size:19px;font-weight:400;color:var(--mute);margin-top:18px}

/* cash */
.amt-pair{display:flex;gap:16px;margin-top:24px}
.amt{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:24px 16px;border-radius:22px}
.amt.a{background:#fff;box-shadow:0 6px 20px rgba(39,43,88,.05)}
.amt.b{background:var(--mint-l)}
.amt-k{font-size:20px;font-weight:400;color:var(--mute)}
.amt.b .amt-k{color:#1C7F6D}
.amt-v{font-size:42px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
.amt.b .amt-v{color:var(--teal)}
.accept{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:10px 0}
.tiles{display:flex;align-items:center;gap:18px}
.bill{width:150px;height:86px;border-radius:12px;border:3px solid #C8CDE4;background:#FBFCFF;
  display:flex;align-items:center;justify-content:center;color:#454B70;font-size:28px;font-weight:700;cursor:pointer}
.bill:active{border-color:var(--blue);background:#F0F4FF}
.coin{width:80px;height:80px;border-radius:50%;border:3px solid #C8CDE4;background:#FBFCFF;
  display:flex;align-items:center;justify-content:center;color:#454B70;font-size:19px;font-weight:700;cursor:pointer}
.coin:active{border-color:var(--blue);background:#F0F4FF}
.fed{animation:feed .22s ease 1}
.falta{font-size:24px;font-weight:500;color:var(--mute)}
.pill{padding:16px 26px;border-radius:18px;background:var(--mint-l);color:#1C7F6D;font-size:24px;font-weight:600;text-align:center}

/* info (otros usos) */
.info-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
.info-ic{display:flex;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;background:#EBEFFF}
.info-ic svg{width:62px;height:62px}
.info-note{font-size:25px;font-weight:400;color:var(--body);text-align:center;max-width:580px;line-height:1.5}

/* done */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.tick{display:flex;align-items:center;justify-content:center;width:144px;height:144px;border-radius:50%;background:var(--mint-l)}
.done h1{font-size:46px}
.done-amt{font-size:68px;font-weight:700;color:var(--teal);letter-spacing:-.03em}
.chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:16px 26px;border-radius:18px;background:#fff;box-shadow:0 6px 20px rgba(39,43,88,.05)}
.chip-k{font-size:17px;font-weight:400;color:var(--mute)}
.chip-v{font-size:23px;font-weight:600;color:var(--ink);letter-spacing:.03em}
.restart{font-size:20px;font-weight:500;color:var(--mute);animation:blink 2.4s ease-in-out infinite}

/* institution glyph block */
.inst{display:flex;align-items:center;gap:18px;padding:24px 26px;border-radius:22px;background:#fff;box-shadow:0 6px 20px rgba(39,43,88,.05)}
.inst-n{font-size:26px;font-weight:600;color:var(--ink)}
.inst-s{font-size:19px;font-weight:400;color:var(--mute);margin-top:2px}

/* demo tab */
#tab{position:fixed;right:0;top:50%;transform:translateY(-50%);width:40px;height:96px;
  border-radius:14px 0 0 14px;background:rgba(18,20,40,.78);border:1px solid #3A3F63;border-right:0;
  display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:90}
#panel{position:fixed;right:18px;top:50%;transform:translateY(-50%);width:244px;display:none;
  flex-direction:column;gap:9px;padding:18px;border-radius:18px;background:rgba(18,20,40,.97);
  border:1px solid #3A3F63;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:91}
#panel.on{display:flex}
#panel h4{font-size:12px;font-weight:600;color:#fff;letter-spacing:.14em;text-transform:uppercase}
#panel .x{color:#8E93B8;font-size:18px;cursor:pointer;line-height:1}
#panel .hd{display:flex;align-items:center;justify-content:space-between}
#panel .now{font-size:12px;color:#8E93B8;line-height:1.5}
#panel button{all:unset;display:flex;align-items:center;justify-content:center;height:40px;border-radius:10px;
  background:#2A2F55;color:#DDE1F2;font-family:Mont;font-size:13px;font-weight:500;cursor:pointer;text-align:center}
#panel button:active{background:#363C69}
#panel button.p{background:var(--blue);color:#fff;font-weight:600}
</style>
</head>

function qrBlock(seed, px){
  // patrón determinista, sólo decorativo
  const n = 25, cell = px / n;
  let h = 0; for (let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) % 99991;
  let r = '<svg viewBox="0 0 '+px+' '+px+'" width="'+px+'" height="'+px+'">';
  const eye = (ox,oy)=>{
    r += '<rect x="'+ox*cell+'" y="'+oy*cell+'" width="'+7*cell+'" height="'+7*cell+'" fill="#141834"/>';
    r += '<rect x="'+(ox+1)*cell+'" y="'+(oy+1)*cell+'" width="'+5*cell+'" height="'+5*cell+'" fill="#fff"/>';
    r += '<rect x="'+(ox+2)*cell+'" y="'+(oy+2)*cell+'" width="'+3*cell+'" height="'+3*cell+'" fill="#141834"/>';
  };
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    const inEye = (x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
    if(inEye) continue;
    h = (h*1103515245 + 12345) & 0x7fffffff;
    if((h>>8)%100 < 46) r += '<rect x="'+x*cell+'" y="'+y*cell+'" width="'+cell+'" height="'+cell+'" fill="#141834"/>';
  }
  eye(0,0); eye(n-7,0); eye(0,n-7);
  return r + '</svg>';
}

  +   '<div class="laser"></div><div class="qr">'+qrBlock("k1-"+S.svc.id+"-"+CFG.dui,156)+'</div>'
  + '</div></div>'
  + '<div class="scan-hint">Buscando c&oacute;digo&hellip;</div>'
  + '<div class="btns" style="margin-top:22px"><div class="btn" data-act="found">Simular lectura</div></div>'
  + '</div></div></div>',

dui: () => {
  const ok = S.entry.length >= S.svc.idLen;
  const keys = ["1","2","3","4","5","6","7","8","9","←","0","⌫"];
  return '<div class="app">' + header(S.svc.name,"Identificación",true) + '<div class="body"><div class="pane">'
  + '<h1>Escribe tu '+S.svc.idLabel+'</h1>'
  + '<div class="sub">Aparece en tu documento.</div>'
  + '<div class="field'+(ok?' ok':'')+'" style="margin-top:24px">'
  +   '<div class="field-v'+(S.entry.length?'':' ph')+'">'+fmtId(S.entry,S.svc)+'</div></div>'
  + '<div class="keys">'
  + keys.map(k=>{
      if(k==="⌫") return '<div class="key" data-act="key" data-k="del">&#9003;</div>';
      if(k==="←") return '<div class="key" data-act="key" data-k="del">&#8592;</div>';
      return '<div class="key" data-act="key" data-k="'+k+'">'+k+'</div>';
    }).join('')
  + '</div>'
  + '<div class="btns" style="margin-top:20px"><div class="btn'+(ok?'':' off')+'" data-act="'+(ok?'found':'')+'">Continuar</div></div>'
  + '</div></div></div>';
},

found: () => '<div class="app">' + header(S.svc.name,"Detalle",true) + '<div class="body"><div class="pane">'
  + '<div class="step"><b></b>Cuenta encontrada</div>'
  + '<h1 style="margin-top:8px">Revisa tu pago</h1>'
  + '<div style="display:flex;flex-direction:column;gap:14px;margin-top:26px">'
  + '<div class="inst"><div class="sq">'+ICON.bank('#272B58')+'</div>'
  +   '<div><div class="inst-n">'+S.svc.inst+'</div><div class="inst-s">'+S.svc.instSub+'</div></div></div>'
  + '<div class="row"><div class="rk">Contribuyente</div><div class="rv">'+CFG.user+'</div></div>'
  + '<div class="row"><div class="rk">'+S.svc.idLabel+'</div><div class="rv">'+fmtId(S.svc.idValue,S.svc)+'</div></div>'
  + '<div class="total"><div class="total-k">Monto a pagar</div><div class="total-v">'+money(S.svc.amount)+'</div></div>'
  + '</div><div class="grow"></div>'
  + '<div class="btns"><div class="btn" data-act="tocash">Continuar</div></div>'
  + '</div></div></div>',

cash: () => {
  const need = Math.max(0, S.svc.amount - S.inserted);
  const over = Math.max(0, S.inserted - S.svc.amount);
  const ok = S.inserted >= S.svc.amount;
  return '<div class="app">' + header(S.svc.name,"Efectivo",true) + '<div class="body"><div class="pane">'
  + '<h1>Ingresa efectivo</h1>'
  + '<div class="sub">'+S.svc.inst+' &middot; '+CFG.user+'</div>'
  + '<div class="amt-pair">'
  +   '<div class="amt a"><div class="amt-k">A pagar</div><div class="amt-v">'+money(S.svc.amount)+'</div></div>'
  +   '<div class="amt b"><div class="amt-k">Ingresado</div><div class="amt-v">'+money(S.inserted)+'</div></div>'
  + '</div>'
  + '<div class="accept"><div class="tiles">'
  + DENOMS.map(d=>{
      const cls = (d.kind==="bill"?"bill":"coin") + (S.fed===d.label?" fed":"");
      return '<div class="'+cls+'" data-act="feed" data-v="'+d.v+'" data-l="'+d.label+'">'+d.label+'</div>';
    }).join('')
  + '</div>'
  + '<div class="scan-hint" style="margin:0">Toca para simular efectivo</div>'
  + (ok
      ? (over>0 ? '<div class="pill">Excedente '+money(over)+' &middot; se abona a tu saldo a favor</div>' : '')
      : '<div class="falta">Falta '+money(need)+'</div>')
  + '</div>'
  + '<div class="btns"><div class="btn'+(ok?'':' off')+'" data-act="'+(ok?'pay':'')+'">Pagar '+money(S.svc.amount)+'</div></div>'
  + '</div></div></div>';
},

done: () => {
  const over = Math.max(0, S.inserted - S.svc.amount);
  return '<div class="app">' + header(S.svc.name,"Completado",false,true) + '<div class="body"><div class="pane">'
  + '<div class="done">'
  +   '<div class="tick">'+ICON.tick+'</div>'
  +   '<h1>Pago realizado</h1>'
  +   '<div style="font-size:26px;font-weight:500;color:var(--body)">'+S.svc.inst+'</div>'
  +   '<div class="done-amt">'+money(S.svc.amount)+'</div>'
  +   '<div class="chip"><div class="chip-k">Contribuyente</div><div class="chip-v">'+CFG.user+'</div></div>'
  +   (over>0 ? '<div class="pill">Se abonaron '+money(over)+' a tu saldo a favor</div>' : '')
  + '</div>'
  + '<div class="btns"><div class="btn" data-act="reset">Finalizar</div></div>'
  + '</div></div></div>';
},

};

const NAMES = { s1:"Diapositiva 1 — 87.4%", s2:"Diapositiva 2 — 4 horas", s3:"Diapositiva 3 — recaudación",
  s4:"Diapositiva 4 — acceso mutuo", s5:"Cierre — otros usos", info:"Otros usos", menu:"Servicios", method:"Identificación", qr:"Código QR",
  dui:"Entrada manual", found:"Detalle", cash:"Efectivo", done:"Completado" };

/* ═══════════ render ═══════════ */
const screen = document.getElementById("screen");
function render(){
  screen.innerHTML = V[S.screen]();
  const n = document.getElementById("now");
  if (n) n.textContent = NAMES[S.screen] || S.screen;
}
function go(s, patch){ Object.assign(S, patch||{}); S.screen = s; render(); }

function next(){
  const i = SLIDES.indexOf(S.screen);
  if (i >= 0) return go(i === SLIDES.length-1 ? "menu" : SLIDES[i+1]);
}
function back(){
  const prev = { method:"menu", qr:"method", dui:"method", found:S.method==="movil"?"qr":"dui", cash:"found", info:"menu" };
  go(prev[S.screen] || "menu");
}
function reset(){ go("s1", { svc:SERVICES[0], method:null, entry:"", inserted:0, fed:null }); }

/* ═══════════ eventos ═══════════ */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act;

  if (a === "next")  return next();
  if (a === "back")  return back();
  if (a === "reset") return reset();

  if (a === "extra") return go("info", { extra: el.dataset.id });
  if (a === "svc"){
    const s = SERVICES.find(x => x.id === el.dataset.id);
    return go("method", { svc:s, entry:"", inserted:0, method:null, fed:null });
  }
  if (a === "method"){
    const m = el.dataset.m;
    return go(m === "movil" ? "qr" : "dui", { method:m, entry:"" });
  }
  if (a === "key"){
    const k = el.dataset.k;
    if (k === "del") S.entry = S.entry.slice(0,-1);
    else if (S.entry.length < S.svc.idLen) S.entry += k;
    return render();
  }
  if (a === "found")  return go("found");
  if (a === "tocash") return go("cash", { inserted:0, fed:null });
  if (a === "feed"){
    S.inserted = Math.round((S.inserted + parseFloat(el.dataset.v)) * 100) / 100;
    S.fed = el.dataset.l; S.fedN++;
    return render();
  }
  if (a === "pay") return go("done");

  if (a === "closepanel") return document.getElementById("panel").classList.remove("on");
  if (a === "go") return go(el.dataset.to, el.dataset.to === "menu" ? { svc:SERVICES[0], entry:"", inserted:0 } : {});
});

document.getElementById("tab").addEventListener("click", () => {
  document.getElementById("panel").classList.toggle("on");
});

document.addEventListener("keydown", e => {
  const k = e.key;
  if (k === "ArrowRight" || k === "Enter" || k === " ") {
    if (SLIDES.indexOf(S.screen) >= 0) { e.preventDefault(); next(); }
  }
  else if (k === "r" || k === "R") reset();
  else if (k === "Escape") go("menu", { svc:SERVICES[0], entry:"", inserted:0 });
});

/* ═══════════ escalado ═══════════ */
function fit(){
  const s = Math.min(window.innerWidth / 800, window.innerHeight / 1280);
  screen.style.transform = "scale(" + s + ")";
}
window.addEventListener("resize", fit);
fit();
render();
</script>
</body>
</html>
